services:
  # ─────────────────────────────────────────
  # Bases de datos
  # ─────────────────────────────────────────
  auth-db:
    image: postgres:17
    container_name: auth_db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
      - ./db-auth:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  courses-db:
    image: postgres:17
    container_name: courses_db
    environment:
      POSTGRES_DB: courses_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - courses_data:/var/lib/postgresql/data
      - ./db-courses:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d courses_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-db:
    image: mongo:latest
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Microservicios backend
  # ─────────────────────────────────────────
  ms-auth:
    build:
      context: ./ms-auth
      dockerfile: Dockerfile
    container_name: ms_auth
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:1234@auth-db:5432/auth_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:3001/auth/google/callback}
      CORS_ORIGIN: http://localhost:2999
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3001:3001"
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped

  ms-courses:
    build:
      context: ./ms-courses
      dockerfile: Dockerfile
    container_name: ms_courses
    environment:
      PORT: 3002
      DATABASE_URL: postgres://postgres:1234@courses-db:5432/courses_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      AUTH_SERVICE_URL: http://ms-auth:3001
    ports:
      - "3002:3002"
    depends_on:
      courses-db:
        condition: service_healthy
    restart: unless-stopped

  ms-core:
    build:
      context: ./ms-core
      dockerfile: Dockerfile
    container_name: ms_core
    environment:
      PORT: 3003
      PLUGIN_DIR: /app/plugins_dist
      MONGO_URI: mongodb://mongo-db:27017/ms_core
      REDIS_URL: redis_cache:6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      AUTH_SERVICE_URL: http://ms-auth:3001
      COURSES_SERVICE_URL: http://ms-courses:3002
      API_GATEWAY_URL: http://api-gateway:3000
      ENVIRONMENT: production
    volumes:
      - type: bind
        source: ./ms-core/plugins_dist
        target: /app/plugins_dist
        read_only: true
      # The ms-core binary is copied into the image at build time
      # (COPY --from=builder /app/bin/ms-core .) so binding the host
      # path here may conflict if it's a directory. Remove that bind
      # mount to use the image's built binary instead.
    ports:
      - "3003:3003"
    depends_on:
      mongo-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3003/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  ms-notis:
    build:
      context: ./ms-notis
      dockerfile: Dockerfile
    container_name: ms_notis
    environment:
      PORT: 3004
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@TeamEdu.cl}
      SMTP_FROM_NAME: TeamEdu
      FRONTEND_URL: http://localhost:2999
      CORS_ORIGIN: http://localhost:2999
      APP_ENV: production
      LOG_LEVEL: info
    ports:
      - "3004:3004"
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    environment:
      GATEWAY_PORT: 3000
      REGISTRO_CURRICULAR_URL: http://ms-auth:3001
      COURSES_URL: http://ms-courses:3002
      CORE_URL: http://ms-core:3003
      NOTIFICATIONS_URL: http://ms-notis:3004
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
    ports:
      - "3000:3000"
    depends_on:
      - ms-auth
      - ms-courses
      - ms-core
      - ms-notis
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────────
  front-eduteam:
    build:
      context: ./front-eduteam
      dockerfile: Dockerfile
    container_name: front_eduteam
    environment:
      PORT: 2999
      HOST: "0.0.0.0"
      NODE_ENV: production
      NUXT_PUBLIC_CORE_API_URL: http://localhost:3000
    ports:
      - "2999:2999"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  auth_data:
  courses_data:
  mongo_data:
